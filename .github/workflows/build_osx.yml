name: build on macos  # with AppleClang

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to build (default: current branch)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag or ref to build'
        required: false
        type: string

concurrency:
  cancel-in-progress: true
  group: build-osx-${{ github.ref }}

permissions:
  contents: read
    
jobs:
  build-osx:
    name: build on macos arm64
    runs-on: macos-latest  # arm64 as of 20260124 Sat https://github.com/actions/runner-images

    steps:
    - name: git checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    #- name: install gcc-11
    #  run: |
    #    brew install gcc@11

    #- name: verify gcc
    #  run: gcc --version

    - name: setup conda
      uses: ./.github/actions/setup-conda

    - name: build
      run: |
        eval "$(conda shell.bash activate)"
        conda env list
        python setup.py all
        echo "=== listing dist/ ==="
        ls -l ./dist
    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: macos-arm64
        retention-days: 3
        path: |
          dist/sortmerna*Darwin.7z
          dist/sortmerna*Darwin.sh
          dist/sortmerna*Darwin.tar.gz
    