name: build multi-platform

on:
  pull_request: 
    branches: 
      - master
  push: 
  #  branches: 
  #    - master
  workflow_dispatch:

concurrency: 
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}


permissions:
  contents: read
    

jobs:
  build-multi-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
    - name: git checkout
      uses: actions/checkout@v4

    - name: setup conda
      uses: ./.github/actions/setup-conda

    - name: build on linux
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y gcc-11 g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
        gcc --version
        eval "$(conda shell.bash activate)"
        conda env list
        python setup.py all
        echo "=== listing dist/ ==="
        ls -l ./dist

    - name: build on macOS
      # latest macos is arm64 based
      if: runner.os == 'macOS'
      run: |
        eval "$(conda shell.bash activate)"
        conda env list
        python setup.py all
        echo "=== listing dist/ ==="
        ls -l ./dist

