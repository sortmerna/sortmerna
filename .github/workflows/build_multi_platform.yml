name: build multi-platform

on:
  pull_request: 
    branches: 
      - master
  push: 
  #  branches: 
  #    - master
  workflow_dispatch:

concurrency: 
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}


permissions:
  contents: read
    

jobs:
  build-multi-platform:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
    - name: git checkout
      uses: actions/checkout@v4

    - name: setup conda
      uses: ./.github/actions/setup-conda

    - name: build on linux
      if: runner.os == 'Linux'
      run: |
        sudo apt update
        sudo apt install -y gcc-11 g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100
        gcc --version
        eval "$(conda shell.bash activate)"
        conda env list
        python setup.py all
        echo "=== listing dist/ ==="
        ls -l ./dist

    - name: build on macOS
      # latest macos is arm64 based
      if: runner.os == 'macOS'
      run: |
        eval "$(conda shell.bash activate)"
        conda env list
        python setup.py all
        echo "=== listing dist/ ==="
        ls -l ./dist

    #- name: upload macOS artifacts
    #  uses: actions/upload-artifact@v4
    #  if: runner.os == 'macOS'
    #  with:
    #    retention-days: 3
    #    path: |
    #      dist/sortmerna*Darwin.7z
    #      dist/sortmerna*Darwin.sh
    #      dist/sortmerna*Darwin.tar.gz
    #- name: upload linux artifacts
    #  uses: actions/upload-artifact@v4
    #  if: runner.os == 'Linux'
    #  with:
    #    retention-days: 3
    #    path: |
    #      dist/sortmerna*Linux.deb
    #      dist/sortmerna*Linux.sh
    #      dist/sortmerna*Linux.tar.gz

  build-linux-aarch64:
    name: Build on Linux ARM64
    runs-on: ubuntu-latest
    
    steps:
    - name: git checkout
      uses: actions/checkout@v4

    - name: Build
      uses: uraimo/run-on-arch-action@v2
      with:
        arch: aarch64
        distro: ubuntu20.04
        githubToken: ${{ github.token }}
        dockerRunArgs: |
          --volume "${PWD}:/sortmerna"
        install: |
          apt-get update -q -y
          apt-get install -q -y gcc g++ wget file python3 git
          if ! command -v conda >/dev/null 2>&1 && [ ! -x "${HOME}/conda/bin/conda" ]; then
            wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-aarch64.sh
            bash Miniforge3-Linux-aarch64.sh -b -p "${HOME}/conda"
            rm -f Miniforge3-Linux-aarch64.sh
          fi
        run: |
          set -x
          command -v conda >/dev/null 2>&1 || export PATH=${HOME}/conda/bin:$PATH
          conda --version
          eval "$(conda shell.bash activate)"
          conda install -c conda-forge -y cmake pyyaml jinja2 requests ninja
          cd /sortmerna
          python3 setup.py all
          echo "=== listing files ==="
          ls -laR
    
