name: build on Linux

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag or ref to build (default: current branch)'
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag or ref to build'
        required: false
        type: string

concurrency:
  cancel-in-progress: true
  group: build-linux-${{ github.ref }}

permissions:
  contents: read
    
jobs:
  build-linux:
    name: build on Linux (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # latest image - artifact names unchanged
          - os: ubuntu-latest
            suffix: ''
          # oldest available image (older glibc -> more portable binaries)
          - os: ubuntu-22.04
            suffix: '-ubuntu22.04'

    steps:
    - name: git checkout
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.tag || github.ref }}

    - name: install gcc-11
      run: |
        sudo apt update
        sudo apt install -y gcc-11 g++-11

    - name: set gcc-11 as default
      run: |
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 100
        sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-11 100

    - name: verify gcc
      run: gcc --version

    - name: setup conda
      uses: ./.github/actions/setup-conda

    - name: build
      run: |
        eval "$(conda shell.bash activate)"
        conda env list
        python setup.py all
        echo "=== listing dist/ ==="
        ls -l ./dist

    - name: rename artifacts with image suffix
      if: matrix.suffix != ''
      env:
        SUFFIX: ${{ matrix.suffix }}
      run: |
        cd dist
        for f in sortmerna*Linux.deb sortmerna*Linux.sh sortmerna*Linux.tar.gz; do
          [ -f "$f" ] || continue
          new="${f%-Linux.*}-Linux${SUFFIX}.${f##*-Linux.}"
          mv "$f" "$new"
          echo "renamed: $f -> $new"
        done
        ls -l

    - name: upload
      uses: actions/upload-artifact@v4
      with:
        name: linux-x64${{ matrix.suffix }}
        retention-days: 3
        path: |
          dist/sortmerna*Linux${{ matrix.suffix }}.deb
          dist/sortmerna*Linux${{ matrix.suffix }}.sh
          dist/sortmerna*Linux${{ matrix.suffix }}.tar.gz
    
